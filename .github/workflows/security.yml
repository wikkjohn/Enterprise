name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so newly-disclosed advisories in unchanged dependencies are caught.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Block the build on known-vulnerable SHIPPED dependencies (high + critical).
      - name: Audit production dependencies (high/critical fails the build)
        run: pnpm audit --prod --audit-level high
      # Full report (incl. dev + moderate/low) for visibility; never fails the build.
      - name: Full advisory report (informational)
        if: always()
        run: pnpm audit || true

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so a secret committed earlier (even if later removed) is still caught.
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # Required by gitleaks-action v2 to scan pull requests.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"
